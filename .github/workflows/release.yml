name: Release package

# Manual only. Builds main, runs the same gates as the source checks, and leaves an unsigned
# framework-dependent ZIP on a draft prerelease. Publishing the draft is a separate, human step.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # creates the draft release; no other step writes to the repository
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_INSTALL_DIR: 'C:\Program Files\dotnet'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Locked restore and dependency advisory gate
        run: |
          dotnet restore Destiny2BlackBox.csproj --locked-mode --force --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/RuntimeBoundaryProbe/RuntimeBoundaryProbe.csproj --locked-mode --force --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release builds with security analyzers
        run: |
          # No PDB and no debug directory, so the shipped DLL carries no build-machine path.
          dotnet build Destiny2BlackBox.csproj -c Release --no-restore --no-incremental -p:DebugType=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/RuntimeBoundaryProbe/RuntimeBoundaryProbe.csproj -c Release --no-restore --no-incremental
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Headless runtime gates as a temporary standard user
        run: ./tests/Invoke-HostedRuntimeGates.ps1
      - name: Source-only checkout remains unchanged
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git ls-files --others --exclude-standard) { throw 'Unexpected untracked files after verification.' }
      - name: Package the tested build onto a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = dotnet msbuild Destiny2BlackBox.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Unusable version '$version'." }
          $name = "PC-Black-Box-v$version-win-x64"
          $output = (Resolve-Path 'bin/Release/net10.0-windows10.0.17763.0').Path

          # Fail closed: ship exactly the files this list names, so nothing unreviewed rides along.
          $expected = @(
            'Microsoft.Windows.SDK.NET.dll', 'OpenMcdf.dll', 'PC Black Box.deps.json', 'PC Black Box.dll',
            'PC Black Box.exe', 'PC Black Box.runtimeconfig.json', 'WinRT.Runtime.dll')
          $actual = @(Get-ChildItem -LiteralPath $output -Recurse -File |
            ForEach-Object { [IO.Path]::GetRelativePath($output, $_.FullName) })
          if (Compare-Object $expected $actual) { throw "Unexpected build output: $($actual -join ', ')" }

          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $name)
          $expected | ForEach-Object { Copy-Item -LiteralPath (Join-Path $output $_) -Destination $stage }
          'LICENSE', 'THIRD-PARTY-NOTICES.md', 'README.md', 'README.en.md', 'CHANGELOG.md' |
            ForEach-Object { Copy-Item -LiteralPath $_ -Destination $stage }

          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$hash  $name.zip" -NoNewline
          "RELEASE_PACKAGE name=$name.zip sha256=$hash"

          # An existing release for this tag makes gh fail, so a published release is never replaced.
          gh release create "v$version" $zip "$zip.sha256" --draft --prerelease --target $env:GITHUB_SHA `
            --title "PC Black Box $version" --notes 'Draft created by the release workflow. Unsigned build; notes pending.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
